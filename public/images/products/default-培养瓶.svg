<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- 中心图标 -->
  <g transform="translate(400, 320)" filter="url(#shadow)">
    <!-- 外圆 -->
    <circle cx="0" cy="0" r="120" fill="white" stroke="#f59e0b" stroke-width="4"/>
    
    <!-- 图标文字 -->
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" fill="#f59e0b" font-weight="bold">
      FLASK
    </text>
  </g>
  
  <!-- 分类名称 -->
  <text x="400" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" fill="#333" font-weight="bold">
    培养瓶
  </text>
  
  <!-- 副标题 -->
  <text x="400" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#666">
    Booster 实验室耗材
  </text>
  
  <!-- 底部品牌 -->
  <text x="400" y="720" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#f59e0b" font-weight="bold">
    BOOSTER
  </text>
  
  <!-- 占位提示 -->
  <text x="400" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#999" font-style="italic">
    产品图片准备中
  </text>
</svg>