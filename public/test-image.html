<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片测试</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .test-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .test-card h3 {
      margin: 0 0 10px 0;
      color: #333;
      font-size: 16px;
    }
    .test-image {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: #f9f9f9;
      border-radius: 8px;
    }
    .error {
      color: red;
      font-size: 12px;
      margin-top: 8px;
    }
    .success {
      color: green;
      font-size: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>🖼️ 产品图片测试</h1>
  <p>测试映射表中随机SKU的图片显示</p>

  <div id="test-container" class="test-grid"></div>

  <script>
    // 从JSON文件加载映射表
    async function loadTests() {
      try {
        const response = await fetch('/data/product-image-map.json');
        const mapping = await response.json();

        // 测试10个随机SKU
        const testSKUs = [
          'BSD-HC-PCR-0P1ML-001',
          'BSD-HC-TIP-10UL-001',
          'BSD-HC-TIP-20UL-001',
          'BSD-HC-TIP-50UL-001',
          'BSD-HC-CUL-15ML-001',
          'BSD-HC-CUL-50ML-001',
          'BSD-HC-CUL-100ML-001',
          'BSD-HC-CUL-500ML-001',
          'BSD-HC-TIP-200UL-001',
          'BSD-HC-TIP-1000UL-001'
        ];

        const container = document.getElementById('test-container');

        testSKUs.forEach(sku => {
          const mappingInfo = mapping[sku];
          const card = document.createElement('div');
          card.className = 'test-card';

          const imageUrl = mappingInfo
            ? `/images/products/${mappingInfo.image}`
            : '/images/products/default-product.svg';

          card.innerHTML = `
            <h3>${sku}</h3>
            <img
              src="${imageUrl}"
              alt="${sku}"
              class="test-image"
              onload="this.nextElementSibling.innerHTML = '✅ 图片加载成功 (' + Math.round(this.naturalWidth/1024) + 'KB)'; this.nextElementSibling.className='success'"
              onerror="this.nextElementSibling.innerHTML = '❌ 图片加载失败: ' + this.src; this.nextElementSibling.className='error'"
            >
            <div>加载中...</div>
            ${mappingInfo ? `<div style="font-size:11px; color:#666; margin-top:4px;">${mappingInfo.image.substring(0,40)}...</div>` : '<div style="font-size:11px; color:#666; margin-top:4px;">未找到映射</div>'}
          `;

          container.appendChild(card);
        });

      } catch (error) {
        console.error('加载失败:', error);
        document.getElementById('test-container').innerHTML = `<p style="color: red;">加载映射表失败: ${error.message}</p>`;
      }
    }

    loadTests();
  </script>
</body>
</html>
